<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><title>LoneWalkerLee iTab 5.4</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="bg"></div><div class="shade"></div><main>
<header><div class="brand">LoneWalkerLee <span>iTab 5.8</span></div><div class="headBtns"><span id="netStatus" class="netStatus">☁️ 在线</span><button id="weatherBtn">☀️ 天气</button><button id="addWidgetBtn">＋ 小组件</button><button id="backupBtn">💾 备份</button><button id="wallpaperBtn">🖼️ 壁纸</button><button id="settingsBtn">⚙️</button></div></header>
<section class="hero"><div id="clock">00:00</div><div id="date"></div><div class="weatherMini" id="weatherMini">正在获取天气…</div>
<form id="search"><select id="engine"><option value="https://www.bing.com/search?q=">Bing</option><option value="https://www.google.com/search?q=">Google</option><option value="https://www.baidu.com/s?wd=">百度</option><option value="https://www.so.com/s?q=">360</option></select><input id="query" autocomplete="off" placeholder="搜索你想找的内容…"><button title="搜索">⌕</button></form><div class="searchTools"><button type="button" id="translateBtn">🌐 翻译</button><button type="button" id="clearHistoryBtn">🧹 清空历史</button><span class="searchHint">Ctrl / ⌘ + K 聚焦搜索</span></div><div id="searchHistory" class="searchHistory"></div></section>
<section id="widgetGrid" class="widgetGrid"></section>
<nav id="cats"></nav><div class="actions"><button id="add">＋ 添加网站</button><button id="autoFav" onclick="autoFillFavicons()">✨ 自动补全图标</button><button id="admin">🔐 管理员</button></div><section id="sites"></section>
<footer>LoneWalkerLee iTab 5.8 · Cloudflare Workers + Neon · 本地缓存 / 离线可用</footer></main>
<dialog id="dlg"><form id="siteForm" class="card"><h3 id="dt">添加网站</h3><input type="hidden" id="sid"><label>名称<input id="title" required></label><label>网址<input id="url" required placeholder="https://example.com"></label><label>图标<input id="icon" value="" placeholder="留空自动获取 favicon，也可以填写 emoji 或图片 URL"></label><div class="iconTools"><button type="button" class="miniBtn" onclick="useAutoFavicon()">🌐 自动获取 favicon</button><label class="checkLine"><input type="checkbox" id="autoIcon" checked> 保存时自动使用网站 favicon</label><span id="iconPreview" class="iconPreview">🔗</span></div><label>分类<select id="category"></select></label><div class="buttons"><button type="button" onclick="dlg.close()">取消</button><button>保存</button></div></form></dialog>
<dialog id="wallDlg"><form id="wallForm" class="card"><h3>🖼️ 壁纸中心</h3><p class="backupIntro">换一张背景，让首页每天都有点新鲜感。预设壁纸不需要新增数据库字段。</p><div id="wallpaperPresets" class="wallpaperPresets"></div><label>自定义壁纸 URL<input id="wallUrl" placeholder="https://图片地址…"></label><div class="wallActions"><button type="button" id="randomWallBtn">🎲 随机一张</button><button type="button" id="clearWallBtn">🌫️ 使用纯色背景</button></div><div class="buttons"><button type="button" onclick="wallDlg.close()">取消</button><button>应用壁纸</button></div></form></dialog>
<dialog id="setdlg"><form id="setForm" class="card"><h3>iTab 设置</h3><label>背景图片 URL<input id="bgurl" placeholder="https://…"></label><label>默认搜索引擎<select id="defengine"><option value="https://www.bing.com/search?q=">Bing</option><option value="https://www.google.com/search?q=">Google</option><option value="https://www.baidu.com/s?wd=">百度</option><option value="https://www.so.com/s?q=">360</option></select></label><div class="buttons"><button type="button" onclick="setdlg.close()">取消</button><button>保存</button></div></form></dialog>
<dialog id="widgetDlg"><form id="widgetForm" class="card"><h3>添加小组件</h3><div id="widgetChoices"></div><div class="buttons"><button type="button" onclick="widgetDlg.close()">关闭</button></div></form></dialog>
<dialog id="configDlg"><form id="configForm" class="card"><h3 id="configTitle">组件设置</h3><div id="configBody"></div><div class="buttons"><button type="button" onclick="configDlg.close()">取消</button><button>保存</button></div></form></dialog>
<dialog id="backupDlg"><form class="card" method="dialog"><h3>💾 数据备份中心</h3><p class="backupIntro">把分类、网站、设置和小组件一次性导出为 JSON；换设备或重装后也能恢复。</p><div class="backupBox"><button type="button" onclick="exportBackup()">⬇️ 导出全部数据</button><label class="fileBtn">⬆️ 导入 JSON 备份<input type="file" accept="application/json,.json" onchange="handleBackupFile(event)"></label></div><div id="backupStatus" class="backupStatus">云端数据由 Neon PostgreSQL 保存。</div><div class="buttons"><button type="submit">关闭</button></div></form></dialog>
<script src="/app.js"></script><script src="/wallpaper.js"></script><script src="/backup.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}</script></body></html>
